name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check Python files
        run: |
          python -m compileall backend

      - name: Test backend
        run: python -m unittest backend.test_embeddings backend.test_workflow -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t rag-backend .

      - name: Verify production image
        run: |
          docker run --rm -e EMBEDDING_PROVIDER=gemini -e LLM_PROVIDER=gemini rag-backend python -c "import importlib.metadata as m; from pathlib import Path; installed = {d.metadata['Name'].lower().replace('_', '-') for d in m.distributions()}; forbidden = installed & {'torch', 'sentence-transformers', 'transformers'}; assert not forbidden, forbidden; assert not list(Path('/app').rglob('.env*')), 'Environment file copied into image'; from fastapi.testclient import TestClient; from backend.main import app; client = TestClient(app); assert client.get('/').status_code == 200; print('Production packages and Gemini startup verified')"
          docker image inspect rag-backend --format='Image size: {{.Size}} bytes'

      - name: Build frontend Docker image
        run: docker build -f frontend/Dockerfile -t rag-frontend .
