services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      DATA_DIR: /app/backend/data
      EMBEDDING_PROVIDER: ${DOCKER_EMBEDDING_PROVIDER:-gemini}
      OLLAMA_HOST: http://host.docker.internal:11434
    ports:
      - "8001:8000"
    volumes:
      - rag-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  rag-data:
